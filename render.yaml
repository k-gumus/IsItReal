# Render Blueprint: Render panelinde "New > Blueprint" ile bu repoyu seçince servis kendiliğinden kurulur.
# API anahtarları (sync: false) kurulum sırasında panelde sorulur; repoya asla yazılmaz.
services:
  - type: web
    name: isitreal
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    domains:
      - isitreal.sezgidetectionsystems.com
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      # Herkese açık sitede kredileri korur: günde en fazla bu kadar yeni doğrulama (önbellekten gelenler sayılmaz)
      - key: DAILY_LIMIT
        value: "100"
      - key: TAVILY_SEARCH_DEPTH
        value: basic
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_FACTCHECK_API_KEY
        sync: false
      - key: CROSSREF_MAILTO
        sync: false
